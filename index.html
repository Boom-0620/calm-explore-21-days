<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>平静地探寻</title>
<style>
:root{ --ink:#3f3c37; --paper:#e9e6df; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#cbc8c2}
body{font-family:"Kaiti SC","KaiTi","STKaiti","楷体","Songti SC","Noto Serif SC",serif;
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;background:var(--paper);transition:background 1.4s ease}
#stage.gray{background:#dedcd9}
#stage.warm{background:#eee9df}
#stage.dim{background:#d7d4cd}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.6;mix-blend-mode:multiply;z-index:3;
 background-image:url("data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='260'%20height='260'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.8'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncA%20type='linear'%20slope='0.055'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect%20width='260'%20height='260'%20filter='url(%23n)'/%3E%3C/svg%3E");}
#vig{position:fixed;inset:0;pointer-events:none;z-index:3;
 background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 55%,rgba(58,52,46,.10) 100%)}
/* ---------- 日记文字 ---------- */
#diary{position:absolute;pointer-events:none;color:var(--ink);z-index:5;
 font-size:clamp(16px,2.5vmin,25px);line-height:2.1;max-width:min(560px,52vw)}
.dline{white-space:pre-wrap;margin:.14em 0 .14em var(--ind,0px);transform:rotate(var(--lr,0deg))}
.cw{display:inline-block;transform:translate(var(--tx,0),var(--ty,0)) rotate(var(--r,0deg)) scale(var(--s,1))}
.ch{display:inline-block;opacity:0;transform:translateY(4px);transition:opacity .45s ease var(--d,0s),transform .45s ease var(--d,0s)}
#diary.on .ch,#notes.on .ch,.on .ch{opacity:1;transform:translateY(0)}
.pyw{position:relative;display:inline-block}
.py{position:absolute;top:-1.05em;left:52%;transform:translateX(-50%) rotate(-4deg);
 font-size:.4em;letter-spacing:.06em;opacity:.8;font-style:normal;white-space:nowrap}
.stk{position:relative}
.stk::after{content:'';position:absolute;left:-8%;right:-8%;top:54%;height:2px;background:currentColor;
 transform:rotate(-3deg);opacity:.7;box-shadow:0 2px 0 0 currentColor;opacity:.35}
.tred{color:#b8402c}
.tbox{display:inline-block;width:.85em;height:.95em;border:1.7px solid currentColor;
 border-radius:3px 5px 2px 4px;transform:rotate(1.5deg);vertical-align:-.1em;opacity:.9}
.note{position:absolute;color:#4c4841;pointer-events:none;z-index:6;
 font-size:clamp(13px,1.9vmin,19px);line-height:1.9;max-width:30vw}
/* ---------- 标注/角落 ---------- */
#dayTag{position:fixed;top:2.4vmin;right:3.6vmin;color:#5a554c;font-size:clamp(15px,2.3vmin,22px);
 transform:rotate(-2.5deg);z-index:7;pointer-events:none;opacity:.9;letter-spacing:.05em}
#endText{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);color:var(--ink);z-index:7;
 pointer-events:none;font-size:clamp(22px,4vmin,40px);letter-spacing:.14em}
#again{position:fixed;bottom:4.5vmin;right:4.5vmin;background:none;border:none;cursor:pointer;
 color:#6a655c;font-family:inherit;font-size:clamp(15px,2.2vmin,20px);transform:rotate(-2deg);
 opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:9}
#again.show{opacity:.55;pointer-events:auto}
#again.show:hover{opacity:.95}
/* ---------- 导航箭头 ---------- */
.nav{position:fixed;bottom:3.2vmin;width:70px;height:40px;background:none;border:none;cursor:pointer;
 opacity:.5;transition:opacity .35s;z-index:9}
.nav:hover{opacity:.95}
.nav svg{width:100%;height:100%;stroke:#4a463e;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
#next{right:3vmin}
#back{left:3vmin;transform:scaleX(-1) rotate(1deg)}
#next.hidden{opacity:0;pointer-events:none}
#next.appear svg path{stroke-dasharray:150;stroke-dashoffset:150;animation:drawin 1s ease .1s forwards}
@keyframes drawin{to{stroke-dashoffset:0}}
/* ---------- 首页 ---------- */
#coverUI{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
 justify-content:flex-start;padding-top:13vh;z-index:8;pointer-events:none;transition:opacity .6s}
#coverUI.off{opacity:0}
#coverUI>*{pointer-events:auto}
#ttl{font-weight:400;color:#3b3833;letter-spacing:.06em}
#sub{color:#57534a;margin-top:2.2vmin;font-size:clamp(16px,2.6vmin,26px)}
#openBtn{background:none;border:none;font-family:inherit;color:#45423b;cursor:pointer;
 font-size:clamp(20px,3.2vmin,30px);margin-top:4vmin;transform:rotate(-2deg);position:relative}
#openBtn::after{content:'';position:absolute;left:-5%;right:-5%;bottom:-1.2vmin;height:1.4vmin;
 background:url("data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%208'%20preserveAspectRatio='none'%3E%3Cpath%20d='M2%205%20C20%202%2040%207%2060%204%20C75%202%2090%206%2098%204'%20fill='none'%20stroke='%2345423b'%20stroke-width='1.6'%20stroke-linecap='round'/%3E%3C/svg%3E") no-repeat center/100% 100%}
#openBtn:hover{transform:rotate(-2deg) scale(1.04)}
#resume{margin-top:4vmin;background:none;border:none;font-family:inherit;color:#6b665c;cursor:pointer;
 font-size:clamp(14px,2vmin,19px);transform:rotate(-1.5deg);opacity:.7;display:none}
#resume:hover{opacity:1}
/* ---------- 其它 ---------- */
@keyframes joltA{0%{transform:translate(0,0)}25%{transform:translate(1.6px,-1.2px) rotate(.35deg)}
 50%{transform:translate(-1.6px,1px)}75%{transform:translate(1px,1.2px) rotate(-.3deg)}100%{transform:none}}
#diary.jolt{animation:joltA .32s}
#fader{position:fixed;inset:0;background:#e9e6df;opacity:0;pointer-events:none;transition:opacity .4s ease;z-index:30}
@media (max-width:640px){ #diary{max-width:86vw} .note{max-width:44vw} }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="notes"></div>
<div id="diary"></div>
<div id="dayTag"></div>
<div id="endText"></div>
<button id="again">再走一遍</button>
<div id="grain"></div><div id="vig"></div>
<div id="coverUI">
  <h1 id="ttl"></h1>
  <div id="sub"></div>
  <button id="openBtn">打开看看</button>
  <button id="resume"></button>
</div>
<button id="back" class="nav" title="前一天">
  <svg viewBox="0 0 70 40"><path d="M60 21 C48 18 34 19 14 20 M24 12 C19 15 15 17 10 20 C16 24 20 26 26 29"/></svg>
</button>
<button id="next" class="nav hidden" title="下一天">
  <svg viewBox="0 0 70 40"><path d="M10 21 C22 18 36 19 56 20 M46 12 C51 15 55 17 60 20 C54 24 50 26 44 29"/></svg>
</button>
<div id="fader"></div>
<script>
'use strict';
/* ==================================================================
   《平静地探寻》 —— 一个孩子的 21 天
   自包含互动作品：蜡笔线条引擎 + 儿童字迹渲染 + 每日一个发现
   ================================================================== */
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
const stageEl=$('#stage'), diaryEl=$('#diary'), notesEl=$('#notes'),
      tagEl=$('#dayTag'), endEl=$('#endText'), fader=$('#fader'),
      nextBtn=$('#next'), backBtn=$('#back'),
      coverUI=$('#coverUI'), ttlEl=$('#ttl'), subEl=$('#sub'),
      openBtn=$('#openBtn'), resumeBtn=$('#resume'), againBtn=$('#again');
let W=innerWidth,H=innerHeight,DPR=1;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOT=REDUCED?0.25:1;
function resize(){DPR=Math.min(devicePixelRatio||1,1.75);W=innerWidth;H=innerHeight;
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);}
resize();

/* ---------- 存档：用户的探索痕迹 ---------- */
const SKEY='calm21_v1';
let store;try{store=JSON.parse(localStorage.getItem(SKEY))}catch(e){}
if(!store||typeof store!=='object'||!store.flags)store={max:0,flags:{}};
function saveStore(){try{localStorage.setItem(SKEY,JSON.stringify(store))}catch(e){}}
const F=k=>!!store.flags[k];

/* ---------- 工具 ---------- */
const TAU=Math.PI*2;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
function RNG(seed){let s=(seed>>>0)||1;return function(){s=(s+0x6D2B79F5)>>>0;
 let t=Math.imul(s^s>>>15,1|s);t=(t+Math.imul(t^t>>>7,61|t))^t;
 return((t^t>>>14)>>>0)/4294967296}}
function hexMix(a,b,t){const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
 const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(t,0,1))).toString(16).padStart(2,'0')).join('')}
function ease(t){return t<0?0:t>1?1:t*t*(3-2*t)}
function outElastic(t){t=clamp(t,0,1);return 1-Math.pow(1-t,3)}

/* ---------- 调色板（蜡笔） ---------- */
const INK='#3d3a35', INK2='#57534b', PENCIL='#6a655b';
const RED='#bd4128', RED2='#d4654a', YEL='#d99f27', YEL2='#e8bd52',
      GRN='#5f7a4a', DKGRN='#46553b', BLU='#4e6c88', PNK='#c67d8e',
      ORG='#c47a37', BRN='#7a5c40', GRAYC='#8b867c';

/* ---------- 线条引擎 ---------- */
function jit(pts,amp,rand){return pts.map(p=>[p[0]+(rand()-0.5)*amp,p[1]+(rand()-0.5)*amp])}
function mk(pts,o={}){const seed=o.seed??(Math.random()*1e9);const rand=RNG(seed);
 const j=o.j??2.2;
 const st={pts:jit(pts,j,rand),w:o.w||2.4,c:o.c||INK,a:o.a??0.85,seed:seed%97};
 st.pts2=jit(pts,j*1.5+1.1,rand);
 if(o.sway)st.sway=o.sway;
 return st}
function resample(pts,n){if(pts.length<2)return Array.from({length:n},()=>pts[0].slice());
 const d=[0];for(let i=1;i<pts.length;i++)d.push(d[i-1]+dist(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1]));
 const tot=d[d.length-1]||1,out=[];
 for(let k=0;k<n;k++){const tg=tot*k/(n-1);let i=1;while(i<d.length-1&&d[i]<tg)i++;
  const u=(tg-d[i-1])/((d[i]-d[i-1])||1);
  out.push([lerp(pts[i-1][0],pts[i][0],u),lerp(pts[i-1][1],pts[i][1],u)])}
 return out}
function part(pts,k){if(k>=1)return pts;const n=Math.max(2,Math.round(pts.length*k));return pts.slice(0,n)}
function place(sts,x,y,s=1,rot=0){const cs=Math.cos(rot),sn=Math.sin(rot);
 return sts.map(st=>{const m=p=>[x+(p[0]*cs-p[1]*sn)*s,y+(p[0]*sn+p[1]*cs)*s];
  const n={...st,pts:st.pts.map(m)};if(st.pts2)n.pts2=st.pts2.map(m);return n})}
function swayPts(pts,sw,t){const k0=Math.pow(sw.k??1.5,1);
 return pts.map((pt,i)=>{const f=i/pts.length;const kk=Math.pow(f,k0)*MOT;
  return [pt[0]+Math.sin(t*sw.sp+sw.ph+f*6)*sw.amp*kk,
          pt[1]+Math.cos(t*sw.sp*0.8+sw.ph)*sw.amp*0.6*kk]})}
function drawStroke(st,t){if(st.hide)return;
 let p=st.pts,q=st.pts2;
 if(st.sway){p=swayPts(st.pts,st.sway,t);q=swayPts(st.pts2,st.sway,t)}
 const fa=st.fa??1;if(fa<=0.01)return;
 ctx.save();
 if(st.dx||st.dy||st.rot){ctx.translate(st.dx||0,st.dy||0);if(st.rot)ctx.rotate(st.rot)}
 ctx.strokeStyle=st.c;ctx.lineCap='round';ctx.lineJoin='round';
 pass(p,st.w,st.a*fa);
 pass(q,st.w*0.5,st.a*0.45*fa);
 ctx.restore();
 function pass(pts,w,a){if(a<=0.01)return;
  const n=pts.length;
  for(let i=0;i<n-1;i+=3){const j=Math.min(i+3,n-1);
   ctx.globalAlpha=a*(0.72+0.28*Math.abs(Math.sin(i*12.9898+st.seed*7.13)));
   ctx.lineWidth=Math.max(0.6,w*(0.72+0.5*Math.abs(Math.sin(i*78.233+st.seed*3.7))));
   ctx.beginPath();ctx.moveTo(pts[i][0],pts[i][1]);
   for(let k=i+1;k<j;k++){const mx=(pts[k][0]+pts[k+1][0])/2,my=(pts[k][1]+pts[k+1][1])/2;
    ctx.quadraticCurveTo(pts[k][0],pts[k][1],mx,my)}
   ctx.lineTo(pts[j][0],pts[j][1]);
   ctx.stroke()}}
 ctx.globalAlpha=1}
function drawStrokes(list,t){for(const st of list)drawStroke(st,t)}

/* ---------- 基本图形 ---------- */
function dLine(x1,y1,x2,y2,o={}){const n=o.n||Math.max(4,Math.floor(dist(x1,y1,x2,y2)/16));
 const bow=o.bow||0;const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;
 const px=-dy/L,py=dx/L;const pts=[];
 for(let i=0;i<=n;i++){const u=i/n,b=Math.sin(u*Math.PI)*bow;
  pts.push([lerp(x1,x2,u)+px*b,lerp(y1,y2,u)+py*b])}
 return [mk(pts,o)]}
function dCircle(cx,cy,r,o={}){const rand=RNG(o.seed??7);const n=o.n||34;const over=o.over??1.12;
 const a0=rand()*TAU,wob=o.wob??r*0.06,pts=[];
 for(let i=0;i<=Math.round(n*over);i++){const a=a0+i/n*TAU;const rr=r+(rand()-0.5)*wob;
  pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}
 return [mk(pts,o)]}
function dDot(cx,cy,r,o={}){return dCircle(cx,cy,r,{...o,n:12,over:1.3,wob:r*0.4})}
function dArc(cx,cy,r,a1,a2,o={}){const rand=RNG(o.seed??7);const n=o.n||Math.max(4,Math.round(r*Math.abs(a2-a1)/14));
 const pts=[];for(let i=0;i<=n;i++){const a=lerp(a1,a2,i/n);const rr=r+(rand()-0.5)*(o.wob??r*0.06);
  pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}
 return [mk(pts,o)]}
function dPoly(vs,o={}){const rand=RNG(o.seed??7);const out=[];const over=o.over??7;
 for(let i=0;i<vs.length-1;i++){let[x1,y1]=vs[i],[x2,y2]=vs[i+1];
  const L=dist(x1,y1,x2,y2);if(L<1)continue;
  const n=Math.max(3,Math.floor(L/16));const dx=(x2-x1)/L,dy=(y2-y1)/L;const pts=[];
  for(let k=0;k<=n;k++){const u=k/n;let x=lerp(x1,x2,u),y=lerp(y1,y2,u);
   if(k===0&&i>0){x-=dx*over*(0.5+rand()*0.9);y-=dy*over*(0.5+rand()*0.9)}
   if(k===n&&i<vs.length-2){x+=dx*over*(0.5+rand()*0.9);y+=dy*over*(0.5+rand()*0.9)}
   pts.push([x,y])}
  out.push(mk(pts,o))}
 return out}
function hatch(cx,cy,rx,ry,seed,o={}){const rand=RNG(seed);const out=[];
 const gap=o.gap||5,n=Math.max(4,Math.floor(rx*ry*3.2/(gap*gap)));
 const ang=o.ang??rand()*TAU;
 for(let i=0;i<n*2.4&&out.length<n;i++){
  const a=rand()*TAU,rr=Math.sqrt(rand());
  const px=cx+Math.cos(a)*rx*rr,py=cy+Math.sin(a)*ry*rr;
  const a2=ang+(rand()-0.5)*0.5,l=(o.len||Math.min(rx,ry)*0.9)*(0.3+rand()*0.7);
  out.push(mk([[px-Math.cos(a2)*l/2,py-Math.sin(a2)*l/2],[px+Math.cos(a2)*l/2,py+Math.sin(a2)*l/2]],
   {c:o.c||INK2,w:o.w||2,a:o.a??0.5,j:1.4,seed:seed+i*13}))}
 return out}
function scribble(cx,cy,r,seed,o={}){const rand=RNG(seed);const loops=o.loops||14,out=[];
 for(let i=0;i<loops;i++){const n=26+Math.floor(rand()*22);
  const base=r*(0.42+rand()*0.5);let rad=base*(0.35+rand()*0.8);
  const a0=rand()*TAU,span=4+rand()*5,dir=rand()<0.5?1:-1,pts=[];
  for(let k=0;k<=n;k++){const u=k/n,a=a0+u*span*dir;
   rad=lerp(rad,base,0.06)+(rand()-0.5)*r*0.18*(o.spread||1);
   pts.push([cx+Math.cos(a)*rad*(o.sx||1),cy+Math.sin(a)*rad*(o.sy||1)])}
  out.push(mk(pts,{c:o.c||INK,w:o.w||(2+r*0.028),a:o.a??0.8,j:1.7,seed:seed+i*77,
   sway:o.sway?{amp:o.sway.amp*MOT,sp:o.sway.sp||0.6,ph:rand()*TAU,k:o.sway.k||1.2}:null}))
 }
 return out}
function pointInBall(x,y,cx,cy,r){return dist(x,y,cx,cy)<r*1.18}

/* ---------- 涂鸦小图（局部坐标，脚底为原点除非说明） ---------- */
function dPerson(seed,o={}){const face=o.face!==false,back=o.back,s=o.scale||1;
 const O=[];const P=(sts,opt)=>{for(const st0 of sts)
  O.push(mk(st0.pts,{w:2.4,c:INK,a:0.9,j:1.6,seed:seed+O.length,...(opt||{})}))};
 const hx=0,hy=-52*s,hr=11*s;
 if(back){ // 后脑勺：头发更满
  const rand=RNG(seed+5);for(let i=0;i<7;i++){const a=Math.PI*(0.9+i/6*1.2)+rand()*0.2;
   P(dArc(hx+Math.cos(a)*hr*0.5,hy+Math.sin(a)*hr*0.5,hr*(0.5+rand()*0.5),a-2.4,a+1.2,{seed:seed+50+i}))}
 }else{
  const rand=RNG(seed+5);for(let i=0;i<5;i++){const a=Math.PI+rand()*Math.PI;
   P(dArc(hx+Math.cos(a)*hr*0.4,hy+Math.sin(a)*hr*0.4,hr*(0.4+rand()*0.5),a-2.2,a+1,{seed:seed+50+i}))}
 }
 P(dCircle(hx,hy,hr,{seed:seed+1}));
 if(face){P(dDot(hx-4*s,hy-1*s,0.9,{seed:seed+2}));P(dDot(hx+4*s,hy-1*s,0.9,{seed:seed+3}));
  P(dArc(hx,hy+4*s,4*s,0.3,Math.PI-0.3,{seed:seed+4}))}
 P(dLine(0,-41*s,0,-18*s,{seed:seed+6}));
 P(dLine(0,-36*s,-13*s,-26*s,{seed:seed+7,sway:o.armSway?{amp:2.2,sp:3,ph:1}:null}));
 P(dLine(0,-36*s,13*s,-26*s,{seed:seed+8,sway:o.armSway?{amp:2.2,sp:3,ph:2.4}:null}));
 P(dLine(0,-18*s,-7*s,0,{seed:seed+9}));
 P(dLine(0,-18*s,7*s,0,{seed:seed+10}));
 return O}
function dHouse(seed,o={}){const s=o.scale||1,c=o.c||INK,w=o.w||2.6;
 return [...dPoly([[-38*s,0],[-38*s,-44*s],[38*s,-44*s],[38*s,0],[-38*s,0]],{seed,w,c,a:0.9}),
  ...dPoly([[-46*s,-44*s],[0,-74*s],[46*s,-44*s]],{seed:seed+1,w,c,a:0.9}),
  ...dPoly([[-6*s,0],[-6*s,-24*s],[10*s,-24*s],[10*s,0]],{seed:seed+2,w:w*0.9,c,a:0.85}),
  ...dPoly([[16*s,-30*s],[30*s,-30*s],[30*s,-16*s],[16*s,-16*s],[16*s,-30*s]],{seed:seed+3,w:w*0.8,c,a:0.85}),
  ...dLine(23*s,-30*s,23*s,-16*s,{seed:seed+4,w:w*0.7,c,a:0.8}),
  ...dLine(16*s,-23*s,30*s,-23*s,{seed:seed+5,w:w*0.7,c,a:0.8})]}
function dTree(seed,o={}){const s=o.scale||1,c=o.c||INK;
 const crown=scribble(0,-52*s,24*s,seed,{loops:5,w:2.3,c,a:0.85});
 const leaf=o.leaf?hatch(0,-52*s,20*s,20*s,seed+9,{c:o.leaf,gap:6,a:0.4,len:14}):[];
 return [...dLine(-3*s,0,-2*s,-34*s,{seed,w:2.6,c,a:0.9}),

  else if(c==='~'){const j=str.indexOf('~',i+1);push(str.slice(i+1,j),'strike');i=j+1}

  if(kind==='bitter')st=[...dCircle(x,tableY-12,14,{seed:seed+7,w:2.8,c:DKGRN,a:0.9}),

 function burst(kind){const units=[];
  for(let i=0;i<10;i++)units.push({x0:mouth[0],y0:mouth[1],
   vx:(Math.random()-0.5)*230,vy:-Math.random()*170,r:Math.random()*3,

 down(x,y){if(chewing)return;

FACT.d13=function(){let objs=[],thread,threadEnd,drag=false,trail=[],conns=0,flick=-1,flickT=0;
 const seed=1313;

 build(){stageEl.className='gray';

   st.forEach(s=>{s.c=INK;s.a=0.75});
   return {x,y,st,tail:[tail[0],tail[1]]}};
  objs=[mk2(W*0.2,H*0.3,s=>dTree(seed,{}),[W*0.2+18,H*0.3]),

  threadEnd=[W*0.5,H*0.5]},
 draw(t,dt){for(const o of objs)drawStrokes(o.st,t);
  if(flick>=0){flickT+=dt;
   const o=objs[flick];
   if(flickT<0.4){for(const s of o.st)drawStroke({...s,w:3.4,a:0.95},t)}
   if(flickT>0.45){flick++;flickT=0;if(flick>=objs.length){flick=-1;setReady()}}}
  for(const c of this._conns)drawStrokes(c,t);
  // 活动线头
  ctx.globalAlpha=0.9;ctx.fillStyle=INK;
  ctx.beginPath();ctx.arc(threadEnd[0],threadEnd[1],3.5+Math.sin(t*5)*0.8,0,TAU);ctx.fill();ctx.globalAlpha=1;
  if(drag&&trail.length>1){
   for(let i=0;i<trail.length-1;i+=3){

 _conns:[],

 up(x,y){if(!drag)return;drag=false;

   drawStrokes(place(this._creBase,cre.x,cre.y,wob,Math.sin(t*(holding?18:2))*(holding?0.1:0.06)),t);
   return}
  if(phase===1){ballT+=dt;
   burst=burst.filter(st=>st.t<1.2);
   for(const st of burst){st.t+=dt;st.dx=st.vx*st.t;st.dy=st.vy*st.t;st.fa=Math.max(0,1-st.t*0.9);
    drawStroke(st,t)}
   if(ballT>0.5&&!ball.length){ball=scribble(ballPos[0],ballPos[1],r*0.075,seed+40,{loops:22});
    buildItems();itemI=0;itemT=0;
    say(['变成了最开始的那团线。'],{delay:0.8,indent:20})}
   if(ball.length){const k=ease(Math.min(1,ballT/1.4));
    ball.forEach((st,i)=>st.fa=clamp(ballT*1.6-i*0.05,0,0.85));
    ctx.save();ctx.translate(ballPos[0],ballPos[1]);ctx.scale(0.3+k*0.7,0.3+k*0.7);
    ctx.translate(-ballPos[0],-ballPos[1]);drawStrokes(ball,t);ctx.restore()}
  }
  if(itemI>=0&&ball.length){
   if(items[itemI]){itemT+=dt;
    if(itemT>0.95){itemI++;itemT=0;
     if(itemI>=items.length&&!finished){finished=true;
      say(['原来它一直在我手里。'],{delay:0.6,indent:26});setReady()}}}
   for(let i=0;i<Math.min(itemI+1,items.length);i++){const it=items[i];
    const k=i===itemI?ease(Math.min(1,itemT*1.8)):1;
    const itx=it.x*W,ity=it.y*H;
    // 连线
    const from=[ballPos[0]+(itx-ballPos[0])*0.24,ballPos[1]+(ity-ballPos[1])*0.24];
    const mx=(from[0]+itx)/2+(Math.sin(i*7)*30),my=(from[1]+ity)/2+(Math.cos(i*5)*30);
    const pts=[];for(let s=0;s<=18;s++){const u=s/18;
     pts.push([(1-u)*(1-u)*from[0]+2*(1-u)*u*mx+u*u*itx,
               (1-u)*(1-u)*from[1]+2*(1-u)*u*my+u*u*ity])}
    drawStroke(mk(part(pts,k),{w:2,a:0.5,c:INK2,j:1.6,seed:seed+60+i}),t);
    // 物件
    const on=it.f.some(k=>F(k));
    const grp=on?it.alive:it.faint;
    grp.forEach((st,j)=>{st.fa=(i===itemI)?clamp(itemT*2.4-j*0.06,0,1):1;
     drawStroke(place([st],itx,ity,1,0)[0],t)})}
   // 没被发现的画个问号
   if(finished&&!this._q){this._q=true;
    for(const it of items)if(!it.f.some(k=>F(k)))note(it.x+0.02,it.y-0.03,['？'],{rot:6})}}}
 ,
 down(x,y){if(phase===0&&dist(x,y,cre.x,cre.y)<52)holding=true},
 up(){holding=false}}};
let holding=false;
/* ==================================================================
   DAY 21 原来是我
   ================================================================== */
FACT.d21=function(){const seed=101;
 let ph=0,phT=0,ball=[],childBase,childBack,reflBase,mirrorBase,creBase,
   armK=0,absorbK=0,path=null,pathK=0,walkK=0,endShown=false,readyToWalk=false;
 function buildPath(){const raw=[[0.5,0.92],[0.46,0.84],[0.54,0.76],[0.47,0.67],[0.53,0.57],[0.49,0.48],[0.51,0.39],[0.5,0.31]]
  .map(p=>[p[0]*W,p[1]*H]);
  const c=resample(raw,64);const Lp=[],Rp=[];
  for(let i=0;i<c.length;i++){const a=c[Math.max(0,i-1)],b=c[Math.min(c.length-1,i+1)];
   let nx=-(b[1]-a[1]),ny=b[0]-a[0];const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;
   const wd=lerp(28,8,i/c.length);
   Lp.push([c[i][0]+nx*wd,c[i][1]+ny*wd]);Rp.push([c[i][0]-nx*wd,c[i][1]-ny*wd])}
  return{c,Lp,Rp}}
 return{text:['今天豆豆没有来。','我找了好久。'],
 textPos:{x:0.06,y:0.07},noNext:true,
 build(){stageEl.className='gray';
  ball=scribble(W*0.5,H*0.5,Math.min(W,H)*0.17,seed,{loops:20});
  ball.forEach((st,i)=>st.sway={amp:1.4,sp:0.55,ph:i*1.7,k:1});
  childBack=dPerson(777,{face:false,scale:1.7});
  reflBase=dPerson(778,{face:true,scale:1.5});
  creBase=scribble(0,0,12,555,{loops:6});
  mirrorBase=[...dPoly([[-34,0],[-34,-150],[34,-150],[34,0]],{seed:900,w:2.8,a:0.85,over:5}),
   ...dPoly([[-27,-8],[-27,-143],[27,-143],[27,-8],[-27,-8]],{seed:901,w:1.8,a:0.6,over:4}),
   ...dLine(-18,0,-24,14,{seed:902,w:2.4,a:0.8}),...dLine(18,0,24,14,{seed:903,w:2.4,a:0.8})];
  this._mirrorDx=W*0.56;this._gy=H*0.8},
 afterBuild(){store.max=Math.max(store.max,21);saveStore()},
 draw(t,dt){phT+=dt;
  const gy=this._gy,mirX=this._mirrorDx,chX=W*0.34;
  const mirrorA=[mirX,gy],reflA=[mirX,gy-2],childA=[chX,gy];
  const creHome=[reflA[0]+14,reflA[1]-58];
  const fade=pathK>0?lerp(1,0.13,ease(Math.min(1,pathK*1.6))):1;
  if(ph===0){drawStrokes(ball,t);
   return}
  if(ph===1){const k=ease(Math.min(1,phT/1.5));
   ball.forEach(st=>st.fa=1-k);drawStrokes(ball,t);
   const mst=place(mirrorBase,mirrorA[0],mirrorA[1],1.15);
   mst.forEach(st=>st.fa=k);drawStrokes(mst,t);
   const cst=place(childBack,childA[0],childA[1],1);
   cst.forEach(st=>st.fa=k);drawStrokes(cst,t);
   const rst=place(reflBase,reflA[0],reflA[1],1);
   rst.forEach(st=>st.fa=k*0.55);drawStrokes(rst,t);
   const crst=place(creBase,creHome[0],creHome[1],1);
   crst.forEach(st=>st.fa=k);drawStrokes(crst,t);
   if(k>=1){ph=2;phT=0;
    say(['后来我在镜子里找到了它。','它站在我的肩膀上。','跟我一模一样。'],{delay:0.5})}
   return}
  if(ph===2||ph===3||ph===4){
   const mst=place(mirrorBase,mirrorA[0],mirrorA[1],1.15);
   mst.forEach(st=>st.fa=fade);drawStrokes(mst,t);
   const rst=place(reflBase,reflA[0],reflA[1],1);
   rst.forEach(st=>st.fa=fade*0.55);drawStrokes(rst,t);
   const cst=place(childBack,childA[0],childA[1],1);
   cst.forEach(st=>st.fa=fade);drawStrokes(cst,t);
   // 伸手
   if(ph===2&&phT>1){armK=Math.min(1,armK+dt*0.5);
    const meet=[(chX+22+(mirX-26))/2,gy-78];
    const h1=[lerp(chX+20,meet[0],ease(armK)),lerp(gy-70,meet[1],ease(armK))];
    const h2=[lerp(mirX-24,meet[0],ease(armK)),lerp(gy-70,meet[1],ease(armK))];
    drawStroke(mk([[chX+12,gy-58],h1],{w:2.6,a:0.9*fade}),t);
    drawStroke(mk([[mirX-14,gy-64],h2],{w:2.2,a:0.5*fade}),t);
    if(armK>=1&&phT>3){ph=3;phT=0}}
   if(ph===2){const crst=place(creBase,creHome[0],creHome[1]+Math.sin(t*3)*2,1);
    drawStrokes(crst,t)}
   if(ph===3){absorbK=Math.min(1,absorbK+dt*0.55);
    const k=ease(absorbK);
    const target=[chX+14,gy-66];
    const crst=place(creBase,lerp(creHome[0],target[0],k),lerp(creHome[1],target[1],k),1-k*0.5);
    crst.forEach(st=>st.fa=1-k);drawStrokes(crst,t);
    if(absorbK>=1){ph=4;phT=0;
     say([{t:'原来是我。',fs:1.5,ind:44}],{delay:0.3})}}
   if(ph===4&&phT>1.6){
    if(!path)path=buildPath();
    pathK=Math.min(1,pathK+dt*0.14);
    const kk=ease(pathK);
    drawStroke(mk(part(path.Lp,kk),{w:2.6,a:0.85,j:2,seed:910}),t);
    drawStroke(mk(part(path.Rp,kk),{w:2.6,a:0.85,j:2,seed:911}),t);
    const dashN=Math.floor(kk*path.c.length/5);
    for(let i=2;i<dashN*5&&i<path.c.length-2;i+=5){
     const a=path.c[i],b=path.c[i+1];
     drawStroke(mk([a,b],{w:2,a:0.4,c:INK2,j:1,seed:920+i}),t)}
    if(pathK>0.25)walkK=Math.min(1,walkK+dt*0.06);
    const idx=walkK*(path.c.length-1),i0=Math.floor(idx);
    const p=path.c[i0];
    const sc=lerp(1.6,0.42,walkK);
    const bob=Math.abs(Math.sin(tNow*7))*3*sc;
    const wst=place(childBack,p[0],p[1]+bob,sc);
    wst.forEach(st=>st.fa=1);drawStrokes(wst,t);
    if(walkK>=1&&!endShown){endShown=true;
     endEl.textContent='我还要去看看。';endEl.style.opacity=0;
     endEl.style.transition='opacity 3s ease';
     requestAnimationFrame(()=>endEl.style.opacity=0.9);
     setTimeout(()=>againBtn.classList.add('show'),7000)}}}
  },
 down(x,y){if(ph===0&&pointInBall(x,y,W*0.5,H*0.5,Math.min(W,H)*0.2)){
   ph=1;phT=0}}}};
